name: monorepo-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify governed text line-ending policy
        shell: bash
        run: |
          test "$(git check-attr eol -- packages/vera_control/src/vera_control/local_profile.py | awk '{print $3}')" = "lf"
          test "$(git check-attr eol -- packages/vera_runtime/src/runtime_cohesion/local_bindings.py | awk '{print $3}')" = "lf"
          test "$(git check-attr eol -- packages/vera_core/src/vera_core/source_transport.py | awk '{print $3}')" = "lf"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Run monorepo test suite
        run: python -m pytest -q
