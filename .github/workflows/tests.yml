name: monorepo-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema cryptography
      - name: Run monorepo test suite
        run: python -m pytest -q
      - name: Build self-contained monorepo wheel
        run: |
          rm -rf dist .wheel-install
          python -m pip wheel . --no-deps -w dist
      - name: Verify wheel closure
        run: python scripts/verify_monorepo_wheel.py dist/*.whl
      - name: Verify installed wheel closure
        run: |
          python -m pip install --no-deps --target .wheel-install dist/*.whl
          PYTHONPATH="$PWD/.wheel-install" python scripts/verify_installed_monorepo.py
          PYTHONPATH="$PWD/.wheel-install" python -m vera_core --help
