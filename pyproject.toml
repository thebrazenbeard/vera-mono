[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-mono"
version = "0.1.0"
requires-python = ">=3.12"
description = "Self-contained Vera monorepo"

[tool.pytest.ini_options]
pythonpath = ["packages/vera_core/src", "packages/rezon/src"]
testpaths = ["tests"]
