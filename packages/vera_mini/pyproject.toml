[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vera-local"
version = "0.1.0"
description = "Original offline mini-Vera: symbolic conversation, cited knowledge and consent-based memory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-vera = "mini_vera.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_vera*"]

[tool.setuptools.package-data]
mini_vera = ["resources/*.json"]

